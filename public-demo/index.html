<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open Data Internships — Live Feed</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <div class="topbar">
      <h1>Open Internships — Live Feed</h1>
      <a class="repo-link" href="https://github.com/diyanair30/data-job-tracker-summer-2027" target="_blank" rel="noreferrer">View on GitHub →</a>
    </div>

    <div class="page-header">
      <div>
        <h2>Open Internships</h2>
        <p class="subtle" id="summary">Loading listings…</p>
      </div>
      <div class="actions">
        <select id="categoryFilter">
          <option value="All">All categories</option>
          <option value="Data">Data</option>
          <option value="Product">Product</option>
          <option value="Consulting">Consulting</option>
        </select>
        <input class="search" id="search" placeholder="Filter by title, company, or location..." />
        <button id="refreshBtn">Refresh Listings</button>
      </div>
    </div>

    <div id="errorBanner" class="error-banner" style="display: none"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Category</th>
            <th>Position</th>
            <th>Company</th>
            <th>Location</th>
            <th>Term</th>
            <th>Date Posted</th>
            <th>Link</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="7" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>

    <p class="footer-note">
      Read-only preview of the Open Internships feed. Clone the
      <a href="https://github.com/diyanair30/data-job-tracker-summer-2027" target="_blank" rel="noreferrer">repo</a>
      to run the full app, including the personal application tracker.
    </p>
  </div>

  <script>
    let jobs = [];

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    function render() {
      const q = document.getElementById("search").value.trim().toLowerCase();
      const category = document.getElementById("categoryFilter").value;
      const filtered = jobs
        .filter((j) => category === "All" || j.category === category)
        .filter(
          (j) =>
            !q ||
            j.position.toLowerCase().includes(q) ||
            j.company.toLowerCase().includes(q) ||
            (j.location || "").toLowerCase().includes(q)
        );

      const tbody = document.getElementById("tbody");
      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty">No matching internships found.</td></tr>';
        return;
      }

      tbody.innerHTML = filtered
        .map(
          (j) => `
        <tr>
          <td><span class="badge badge-${j.category.toLowerCase()}">${j.category}</span></td>
          <td>${escapeHtml(j.position)}</td>
          <td>${escapeHtml(j.company)}</td>
          <td>${escapeHtml(j.location) || "—"}</td>
          <td>${j.terms && j.terms.length ? escapeHtml(j.terms.join(", ")) : "—"}</td>
          <td>${escapeHtml(j.date_posted) || "—"}</td>
          <td><a href="${j.url}" target="_blank" rel="noreferrer">Apply →</a></td>
        </tr>`
        )
        .join("");
    }

    async function load(refresh = false) {
      const btn = document.getElementById("refreshBtn");
      const errorBanner = document.getElementById("errorBanner");
      btn.disabled = true;
      btn.textContent = "Refreshing...";
      errorBanner.style.display = "none";
      try {
        const res = await fetch(`/api/jobs${refresh ? "?refresh=true" : ""}`);
        if (!res.ok) throw new Error(`Failed to load listings (${res.status})`);
        jobs = await res.json();
        document.getElementById("summary").textContent =
          `Live feed from three continuously-updated internship trackers, filtered to active Data, Product Management, and Consulting roles that accept a Bachelor's degree, excluding Fall and co-op postings. ${jobs.length} open right now.`;
        render();
      } catch (err) {
        errorBanner.textContent = err.message;
        errorBanner.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Refresh Listings";
      }
    }

    document.getElementById("refreshBtn").addEventListener("click", () => load(true));
    document.getElementById("search").addEventListener("input", render);
    document.getElementById("categoryFilter").addEventListener("change", render);

    load();
  </script>
</body>
</html>
